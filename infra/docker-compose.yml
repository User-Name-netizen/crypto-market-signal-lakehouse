services:
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: lakehouse-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    cpus: "0.80"
    networks: [lakehouse-net]

  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    mem_limit: 768m
    cpus: "0.50"
    networks: [lakehouse-net]

  # ============================================================
  # STREAMING PIPELINE: Producer → Bronze → Silver → Gold
  # ============================================================

  stream-producer:
    build:
      context: ..
      dockerfile: infra/Dockerfile.stream
    image: lakehouse-stream-producer:latest
    container_name: lakehouse-stream-producer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: binance_trades
      BINANCE_WS_URL: wss://stream.binance.com:9443/ws/btcusdt@aggTrade
    volumes:
      - ../:/app
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "/app/ingestion/stream_to_kafka.py"]
    mem_limit: 256m
    cpus: "0.30"
    networks: [lakehouse-net]

  stream-bronze:
    build:
      context: ..
      dockerfile: infra/Dockerfile.spark
    image: lakehouse-spark-env:latest
    container_name: lakehouse-stream-bronze
    restart: unless-stopped
    environment:
      SPARK_LOCAL_HOSTNAME: localhost
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ../:/app
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    command: ["python", "/app/processing/pyspark_stream_to_bronze.py"]
    mem_limit: 1536m
    cpus: "1.00"
    networks: [lakehouse-net]

  stream-silver:
    image: lakehouse-spark-env:latest
    container_name: lakehouse-stream-silver
    restart: unless-stopped
    environment:
      SPARK_LOCAL_HOSTNAME: localhost
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ../:/app
    depends_on:
      minio:
        condition: service_started
      stream-bronze:
        condition: service_started
    command: ["python", "/app/processing/pyspark_bronze_to_silver.py"]
    mem_limit: 1536m
    cpus: "1.00"
    networks: [lakehouse-net]

  stream-gold:
    image: lakehouse-spark-env:latest
    container_name: lakehouse-stream-gold
    restart: unless-stopped
    environment:
      SPARK_LOCAL_HOSTNAME: localhost
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ../:/app
    depends_on:
      minio:
        condition: service_started
      stream-silver:
        condition: service_started
    command: ["python", "/app/processing/pyspark_silver_to_gold.py"]
    mem_limit: 1536m
    cpus: "1.00"
    networks: [lakehouse-net]

  # ============================================================
  # BATCH PIPELINE: Prefect Server + Process Worker
  # ============================================================

  prefect-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prefect
    image: lakehouse-prefect-run:latest
    container_name: lakehouse-prefect-server
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_UI_API_URL: http://localhost:4200/api
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4200/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    cpus: "0.80"
    networks: [lakehouse-net]

  prefect-worker:
    image: lakehouse-spark-env:latest
    container_name: lakehouse-prefect-worker
    restart: unless-stopped
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      SPARK_LOCAL_HOSTNAME: localhost
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ../:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    depends_on:
      prefect-server:
        condition: service_healthy
    command:
      - /bin/sh
      - -lc
      - |
        echo "==> Creating process work pool..."
        prefect work-pool create default-pool --type process 2>/dev/null || true
        echo "==> Deploying all flows from prefect.yaml..."
        prefect deploy --all 2>/dev/null || true
        echo "==> Starting process worker..."
        prefect worker start --pool default-pool
    mem_limit: 2g
    cpus: "1.00"
    networks: [lakehouse-net]

  # ============================================================
  # OPTIONAL SERVICES (activated with: docker-compose --profile full up -d)
  # ============================================================

  gold-api:
    image: lakehouse-spark-env:latest
    container_name: lakehouse-gold-api
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "5000:5000"
    environment:
      API_PORT: 5000
      FLASK_DEBUG: "false"
      TRINO_HOST: trino
      TRINO_PORT: 8080
      TRINO_USER: admin
      TRINO_CATALOG: delta
      TRINO_SCHEMA: gold
      TRINO_HTTP_SCHEME: http
    volumes:
      - ../:/app
    depends_on:
      trino:
        condition: service_started
    command: ["python", "/app/api/gold_api.py"]
    mem_limit: 768m
    cpus: "0.60"
    networks: [lakehouse-net]

  trino:
    image: trinodb/trino:443
    container_name: lakehouse-trino
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - minio
    mem_limit: 1g
    cpus: "0.70"
    networks: [lakehouse-net]

  metabase:
    image: metabase/metabase:latest
    container_name: lakehouse-metabase
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
    depends_on:
      - trino
    mem_limit: 1g
    cpus: "0.70"
    networks: [lakehouse-net]

volumes:
  prefect-data:
  kafka-data:

networks:
  lakehouse-net:
    name: lakehouse-net
